name: Build Go Binaries

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [windows, darwin, linux]
        goarch: [amd64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Get build metadata
        id: meta
        run: |
          echo "BUILD_VERSION=$(git describe --tags --always)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "BUILD_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build binary
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-X main.buildVersion=${{ env.BUILD_VERSION }} -X main.buildDate=${{ env.BUILD_DATE }} -X main.buildCommit=${{ env.BUILD_COMMIT }}" \
            -o client-${{ matrix.goos }}-${{ matrix.goarch }}$EXT ./cmd/client
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-X main.buildVersion=${{ env.BUILD_VERSION }} -X main.buildDate=${{ env.BUILD_DATE }} -X main.buildCommit=${{ env.BUILD_COMMIT }}" \
            -o server-${{ matrix.goos }}-${{ matrix.goarch }}$EXT ./cmd/server

      - name: Prepare config file
        run: |
          cp config_client.example.json config_client.json
          cp config_server.example.json config_server.json

      - name: Prepare docker files
        run: |
          mkdir -p docker/db/init
          cp -r internal/server/infra/db/init/* docker/db/init/
          cp docker-compose.yaml docker/docker-compose.yaml
          sed -i 's|\./internal/server/infra/db/init|\./docker/db/init|' docker/docker-compose.yaml
          echo "DB_PORT_EXTERNAL=5432" > docker/.env

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            client-${{ matrix.goos }}-${{ matrix.goarch }}*
            server-${{ matrix.goos }}-${{ matrix.goarch }}*
            config_client.json
            config_server.json
            certs/*
            docker/*
            docker/.env
            screen*.png
            README.md
          retention-days: 3
          include-hidden-files: true

  release:
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts as zip
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: ${{ github.event.workflow.name }}
          run_id: ${{ github.run_id }}
          path: downloads
          skip_unpack: true
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: downloads/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
