syntax = "proto3";

package gophkeeper;

option go_package = "./pkg/proto";

service SecretService {
  rpc Store(SecretStoreRequest) returns (Secret);
  rpc Delete(SecretDeleteRequest) returns (Secret);
  rpc Stream(Auth) returns (stream SecretEvent);
}

message Auth {
  string id = 1;
  int64 user_id = 2;
  int64 timestamp = 3;
  bytes signature = 4;
}

message Secret {
  string id = 1;
  bytes crypt = 2;
  bytes meta = 3;
  bytes data = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message SecretStoreRequest {
  Auth auth = 1;
  string id = 2;
  bytes crypt = 3;
  bytes meta = 4;
  bytes data = 5;
  int64 event_time = 6;
}

message SecretDeleteRequest {
  Auth auth = 1;
  int64 event_time = 2;
}

enum SecretAction {
  UNKNOWN = 0;
  LIST = 1;
  STORED = 2;
  DELETED = 3;
}

message SecretEvent {
  SecretAction action = 1;
  string id = 2;
  Secret secret = 3;
}
